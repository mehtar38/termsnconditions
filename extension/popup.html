<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>T&C Analyzer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
    }

    .container {
      background: white;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e5e7eb;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 4px;
    }

    .status {
      background: #f9fafb;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 16px;
    }

    .recommendation {
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .recommendation.yes {
      background: #10b981;
    }

    .recommendation.no {
      background: #ef4444;
    }

    .recommendation.caution {
      background: #f59e0b;
    }

    .recommendation-badge {
      font-size: 32px;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
    }

    .recommendation-text {
      font-size: 14px;
      color: white;
    }

    .summary {
      background: #f9fafb;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary-btn {
      background: #667eea;
      color: white;
    }

    .secondary-btn {
      background: #e5e7eb;
      color: #4b5563;
    }

    .chat-btn {
      background: white;
      border: 2px solid #667eea;
      color: #667eea;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 T&C Analyzer</h1>
    </div>

    <!-- Status Section -->
    <div id="status" class="status">
      <p>Loading...</p>
    </div>

    <!-- Error Section -->
    <div id="error" class="hidden" style="background: #fee2e2; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
      <p id="errorText" style="color: #991b1b; font-size: 13px; margin-bottom: 12px;"></p>
      <button id="retryBtn" class="secondary-btn">Retry</button>
    </div>

    <!-- Analysis Section -->
    <div id="analysis" class="hidden">
      <div id="recommendation" class="recommendation">
        <div id="recommendationBadge" class="recommendation-badge">-</div>
        <div id="recommendationText" class="recommendation-text">-</div>
      </div>

      <div class="summary">
        <p id="summaryText">No summary available</p>
      </div>

      <button id="openChatBtn" class="chat-btn">
        💬 Open Full Analysis in Chat
      </button>
    </div>

    <!-- Action Buttons -->
    <div style="margin-top: 16px;">
      <button id="analyzeBtn" class="primary-btn">Analyze This Page</button>
      <button id="clearBtn" class="secondary-btn">Clear</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
